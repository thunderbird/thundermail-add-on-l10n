# Configuration for moz-fluent-linter, run on en-US by .github/workflows/reference_lint.yaml.
# Rule reference: https://github.com/mozilla-l10n/moz-fluent-linter/blob/main/src/fluent_linter/config.yml

---
ID01:
    enabled: true
    exclusions:
        messages: []
        files: []
ID02:
    enabled: true
    min_length: 6
    exclusions:
        messages: []
        files: []
PS01:
    disabled: false
VC01:
    disabled: false
CO01:
    enabled: true
    brands:
        - Thunderbird
        - Thundermail
        - Mozilla
    exclusions:
        messages: []
        files: []
